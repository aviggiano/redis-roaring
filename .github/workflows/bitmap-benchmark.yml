# Benchmarks the native bitmap implementation from the redis/redis native
# bitmap PR (aviggiano/redis) against baseline Redis and the redis-roaring
# module. Moved here from the aviggiano/redis fork so the upstream PR stays a
# clean product diff; all Redis trees are checked out explicitly by ref.
name: Bitmap Benchmark

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Linux x64 runner label to use; choose the largest configured runner for publishable numbers"
        default: "ubuntu-latest"
      baseline_redis_ref:
        description: "Baseline aviggiano/redis commit SHA/ref to build in legacy mode; use a full SHA for publishable numbers"
        default: "unstable"
      baseline_native_redis_ref:
        description: "Optional aviggiano/redis commit SHA/ref to build in native mode for native-to-native deltas; empty disables it"
        default: ""
      core_redis_ref:
        description: "Candidate aviggiano/redis commit SHA/ref to build in native and legacy guardrail modes"
        default: "unstable"
      module_host_redis_ref:
        description: "redis/redis host commit SHA/ref used to load redis-roaring; use a full SHA for publishable numbers"
        default: "unstable"
      redis_roaring_ref:
        description: "aviggiano/redis-roaring commit SHA/ref to build as the module; empty means the revision this workflow runs from"
        default: ""
      benchmark_profile:
        description: "Benchmark profile: full, smoke, small-sets, bitsets, or mixed-bitop"
        default: "full"
      report_view:
        description: "Report view: combined, performance, memory, payload, or accounting"
        default: "combined"
      request_scale:
        description: "Multiplier for command benchmark request counts"
        default: "1.0"
      runs:
        description: "Repeated command samples per workload"
        default: "3"
      realdata_archives:
        description: "Comma-separated real-roaring dataset archives to download"
        default: "census1881,census-income,uscensus2000,weather_sept_85,wikileaks-noquotes"
      extra_args:
        description: "Extra tools/bitmap-bench.py arguments"
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 360
    # Requested refs are exposed to every step through the job env mapping so
    # they never pass through script text (see the note on the benchmark step).
    env:
      CORE_REDIS_REF: ${{ inputs.core_redis_ref }}
      BASELINE_REDIS_REF: ${{ inputs.baseline_redis_ref }}
      BASELINE_NATIVE_REDIS_REF: ${{ inputs.baseline_native_redis_ref }}
      MODULE_HOST_REDIS_REF: ${{ inputs.module_host_redis_ref }}
      REDIS_ROARING_REF: ${{ inputs.redis_roaring_ref || github.sha }}

    steps:
      - name: Checkout baseline
        uses: actions/checkout@v6
        with:
          repository: aviggiano/redis
          ref: ${{ inputs.baseline_redis_ref }}
          path: before

      - name: Checkout native baseline
        if: ${{ inputs.baseline_native_redis_ref != '' }}
        uses: actions/checkout@v6
        with:
          repository: aviggiano/redis
          ref: ${{ inputs.baseline_native_redis_ref }}
          path: before-native

      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          repository: aviggiano/redis
          ref: ${{ inputs.core_redis_ref }}
          path: after

      - name: Checkout module host Redis
        uses: actions/checkout@v6
        with:
          repository: redis/redis
          ref: ${{ inputs.module_host_redis_ref }}
          path: module-host

      - name: Checkout redis-roaring
        uses: actions/checkout@v6
        with:
          repository: aviggiano/redis-roaring
          # Default to the revision this workflow runs from so dispatches from
          # branches benchmark their own harness and module code.
          ref: ${{ inputs.redis_roaring_ref || github.sha }}
          path: redis-roaring

      - name: Record checked-out SHAs
        run: |
          before_sha="$(git -C before rev-parse HEAD)"
          before_native_sha=""
          if [ -d before-native ]; then
            before_native_sha="$(git -C before-native rev-parse HEAD)"
          fi
          after_sha="$(git -C after rev-parse HEAD)"
          module_host_sha="$(git -C module-host rev-parse HEAD)"
          redis_roaring_sha="$(git -C redis-roaring rev-parse HEAD)"
          echo "BEFORE_SHA=$before_sha" >> "$GITHUB_ENV"
          echo "BEFORE_NATIVE_SHA=$before_native_sha" >> "$GITHUB_ENV"
          echo "AFTER_SHA=$after_sha" >> "$GITHUB_ENV"
          echo "MODULE_HOST_SHA=$module_host_sha" >> "$GITHUB_ENV"
          echo "REDIS_ROARING_SHA=$redis_roaring_sha" >> "$GITHUB_ENV"

      - name: Build baseline
        working-directory: before
        run: make -j"$(nproc)" REDIS_CFLAGS='-Werror'

      - name: Build native baseline
        if: ${{ inputs.baseline_native_redis_ref != '' }}
        working-directory: before-native
        run: make -j"$(nproc)" REDIS_CFLAGS='-Werror'

      - name: Build candidate
        working-directory: after
        run: make -j"$(nproc)" REDIS_CFLAGS='-Werror'

      - name: Build module host Redis
        working-directory: module-host
        run: make -j"$(nproc)" REDIS_CFLAGS='-Werror'

      - name: Build redis-roaring module
        run: |
          git -C redis-roaring submodule update --init --recursive deps/CRoaring deps/hiredis
          (
            cd redis-roaring/src
            ../deps/CRoaring/amalgamation.sh
          )
          cmake -S redis-roaring -B redis-roaring/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_ROARING_TESTS=OFF \
            -DDISABLE_TESTS=ON
          cmake --build redis-roaring/build --target redis-roaring --parallel "$(nproc)"
          module_path="$(find "$GITHUB_WORKSPACE/redis-roaring/build" -type f -name 'libredis-roaring*.so' | head -n 1)"
          test -n "$module_path"
          echo "REDIS_ROARING_MODULE=$module_path" >> "$GITHUB_ENV"

      - name: Prepare benchmark directories
        env:
          RUNNER_LABEL: ${{ inputs.runner_label }}
          BENCHMARK_PROFILE: ${{ inputs.benchmark_profile }}
          REPORT_VIEW: ${{ inputs.report_view }}
        run: |
          mkdir -p "$RUNNER_TEMP/croaring-realdata"
          mkdir -p "$GITHUB_WORKSPACE/bitmap-bench-results"
          {
            echo "runner_label=$RUNNER_LABEL"
            echo "baseline_redis_ref_input=$BASELINE_REDIS_REF"
            echo "before_sha=$BEFORE_SHA"
            echo "baseline_native_redis_ref_input=$BASELINE_NATIVE_REDIS_REF"
            echo "before_native_sha=$BEFORE_NATIVE_SHA"
            echo "core_redis_ref_input=$CORE_REDIS_REF"
            echo "after_sha=$AFTER_SHA"
            echo "module_host_redis_ref_input=$MODULE_HOST_REDIS_REF"
            echo "module_host_sha=$MODULE_HOST_SHA"
            echo "redis_roaring_ref_input=$REDIS_ROARING_REF"
            echo "redis_roaring_sha=$REDIS_ROARING_SHA"
            echo "redis_roaring_module=$REDIS_ROARING_MODULE"
            echo "benchmark_profile=$BENCHMARK_PROFILE"
            echo "report_view=$REPORT_VIEW"
            uname -a
            lscpu || true
            free -h || true
          } > "$GITHUB_WORKSPACE/bitmap-bench-results/runner.txt"

      - name: Run bitmap benchmark compare
        working-directory: after
        # Dispatch inputs reach the shell only through environment variables
        # and an argv array; they are never spliced into the script text.
        env:
          BENCHMARK_PROFILE: ${{ inputs.benchmark_profile }}
          REPORT_VIEW: ${{ inputs.report_view }}
          REQUEST_SCALE: ${{ inputs.request_scale }}
          RUNS: ${{ inputs.runs }}
          REALDATA_ARCHIVES: ${{ inputs.realdata_archives }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          bench_args=(
            --compare-before-src-dir "$GITHUB_WORKSPACE/before/src"
          )
          if [ -n "$BASELINE_NATIVE_REDIS_REF" ]; then
            bench_args+=(--compare-before-native-src-dir "$GITHUB_WORKSPACE/before-native/src")
          fi
          bench_args+=(
            --compare-after-src-dir "$GITHUB_WORKSPACE/after/src"
            --compare-module-src-dir "$GITHUB_WORKSPACE/module-host/src"
            --compare-module-path "$REDIS_ROARING_MODULE"
            --compare-legacy-src-dir "$GITHUB_WORKSPACE/after/src"
            --compare-out "$GITHUB_WORKSPACE/bitmap-bench-results/bitmap-bench-compare"
            --module-sha "$REDIS_ROARING_SHA"
            --benchmark-profile "$BENCHMARK_PROFILE"
            --report-view "$REPORT_VIEW"
            --request-scale "$REQUEST_SCALE"
            --runs "$RUNS"
            --ping-canary
            --croaring-realdata-dir "$RUNNER_TEMP/croaring-realdata"
            --download-croaring-realdata
            --realdata-archives "$REALDATA_ARCHIVES"
            --realdata-max-files 10
          )
          # extra_args is whitespace-separated; each token becomes one argv
          # entry with no shell evaluation.
          read -r -a extra_args <<< "$EXTRA_ARGS"
          python3 "$GITHUB_WORKSPACE/redis-roaring/tools/bitmap-bench.py" \
            "${bench_args[@]}" "${extra_args[@]}"

      - name: Publish benchmark report summary
        if: ${{ always() }}
        env:
          BENCHMARK_PROFILE: ${{ inputs.benchmark_profile }}
          REPORT_VIEW: ${{ inputs.report_view }}
        run: |
          report="$GITHUB_WORKSPACE/bitmap-bench-results/bitmap-bench-compare.md"
          summary_limit=900000
          {
            echo "## Bitmap Benchmark Report"
            echo
            echo "- Benchmark profile: \`$BENCHMARK_PROFILE\`"
            echo "- Report view: \`$REPORT_VIEW\`"
            echo "- Candidate: [redis_pr_native](https://github.com/aviggiano/redis/commit/$AFTER_SHA)"
            echo
            if [ -s "$report" ]; then
              report_bytes="$(wc -c < "$report")"
              if [ "$report_bytes" -gt "$summary_limit" ]; then
                head -c "$summary_limit" "$report"
                echo
                echo
                echo "_Report truncated in the job summary; download the artifact for the full report._"
              else
                cat "$report"
              fi
            else
              echo "Benchmark report was not generated. Check the benchmark step logs for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        # Runs on failure too: the harness persists per-target compare JSONs
        # under bitmap-bench-results/ precisely so a failed multi-hour run
        # still leaves its completed passes inspectable.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bitmap-bench-results
          path: bitmap-bench-results/
